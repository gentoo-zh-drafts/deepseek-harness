name: Sync with upstream (node_modules)

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "npm version of @deepseek-ai/dsh, e.g. 0.1.2-rc.1 (empty = latest dsh-v tag)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: resolve version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ver=$(gh api repos/deepseek-ai/deepseek-harness/tags --jq '.[].name' \
              | grep '^dsh-v' | sed 's/^dsh-v//' | sort -V | tail -1)
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: skip if bundle exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" --repo "${{ github.repository }}" \
             --json assets --jq '.assets[].name' 2>/dev/null \
             | grep -qx "deepseek-harness-${{ steps.v.outputs.version }}-node_modules.tar.xz"; then
            echo "exists=1" >> "$GITHUB_OUTPUT"
            echo "bundle for ${{ steps.v.outputs.version }} already built -- nothing to do"
          fi

      - name: setup node
        if: steps.check.outputs.exists != '1'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: ensure npm install-scripts support
        if: steps.check.outputs.exists != '1'
        run: |
          npm install -g npm@11
          npm --version

      - name: build node_modules bundle
        if: steps.check.outputs.exists != '1'
        run: |
          set -euo pipefail
          ver="${{ steps.v.outputs.version }}"
          # Install the CLI as a dependency, not as the root: its devDependencies
          # reference unpublished experimental packages, so a root install 404s.
          mkdir -p stub
          printf '{"name":"dsh-runtime","version":"1.0.0","private":true,"dependencies":{"@deepseek-ai/dsh":"%s"}}\n' "$ver" > stub/package.json
          cd stub
          npm install --omit=dev --legacy-peer-deps --no-audit --no-fund
          # npm 11 blocks dependency install scripts by default; node-pty needs
          # its prebuild fetched, koffi and subprocess-local need their scripts.
          npm install-scripts approve node-pty koffi @deepseek-ai/dsh-subprocess-local
          npm rebuild node-pty koffi @deepseek-ai/dsh-subprocess-local
          rm -rf node_modules/@deepseek-ai/dsh node_modules/.bin
          cd ..
          mkdir -p package
          mv stub/node_modules package/
          tar -cJf "/tmp/deepseek-harness-${ver}-node_modules.tar.xz" package
          tar -tf "/tmp/deepseek-harness-${ver}-node_modules.tar.xz" > /tmp/list.txt
          grep -q '^package/node_modules/node-pty/prebuilds/linux-x64/pty.node' /tmp/list.txt \
            || { echo "missing node-pty linux-x64 prebuild" >&2; exit 1; }

      - name: release bundle
        if: steps.check.outputs.exists != '1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          files: /tmp/deepseek-harness-${{ steps.v.outputs.version }}-node_modules.tar.xz
